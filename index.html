<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--/wrap-->
<title>清掃お仕事アプリ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Worker = today card + month calendar + upcoming; cleaning = one scrolling checklist with a sticky send bar. Admin = to-do list + today + calendar. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#17302A; --muted:#566962; --line:#D3DDD7;
  --work:#1E6A4E; --work-ink:#FFFFFF; --work-soft:#DDEDE5;
  --open:#A85F00; --open-soft:#FBEBD3; --filled:#E4E9E6;
  --danger:#B3261E; --sun:#B3261E; --sat:#1F5FA8; --demo:#2B2F6B; --demo-ink:#FFFFFF;
  --font:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#18221E; --ink:#E4EDE8; --muted:#9BAEA6; --line:#2C3A34;
  --work:#4DB487; --work-ink:#08160F; --work-soft:#1D3328;
  --open:#EDA94D; --open-soft:#3A2B15; --filled:#232D29;
  --danger:#F28B82; --sun:#F28B82; --sat:#8AB4F8; --demo:#C9CCF5; --demo-ink:#16183A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221E; --ink:#E4EDE8; --muted:#9BAEA6; --line:#2C3A34;
  --work:#4DB487; --work-ink:#08160F; --work-soft:#1D3328;
  --open:#EDA94D; --open-soft:#3A2B15; --filled:#232D29;
  --danger:#F28B82; --sun:#F28B82; --sat:#8AB4F8; --demo:#C9CCF5; --demo-ink:#16183A; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--work);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;gap:12px}
.top .who{font-size:20px;font-weight:700}
.top .role{font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:3px}
.top .date{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.card>h2{font-size:16px;margin-bottom:8px}
.today{background:var(--work);color:var(--work-ink);border:none;display:flex;flex-direction:column;gap:12px}
.today .label{font-size:14px;font-weight:500;opacity:.85}
.today .place{font-size:26px;font-weight:700;line-height:1.3}
.today .sub{font-size:15px;opacity:.9}
.today.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:12px;border:none;font-size:18px;font-weight:700;padding:12px 16px}
.btn.sm{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
.btn.on-work{background:var(--work-ink);color:var(--work)}
.btn.primary{background:var(--work);color:var(--work-ink)}
.btn.primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:16px;min-height:48px}
.btn.ghost.sm{font-size:15px;min-height:44px}
.link{background:none;border:none;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:14px}
.linkcard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:16px}

.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h2{font-size:18px}
.calhead button{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:4px}
.wd.sun{color:var(--sun)}.wd.sat{color:var(--sat)}
.day{min-height:60px;border-radius:10px;border:1px solid transparent;background:none;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;min-width:0}
.day.blank{visibility:hidden}
.day .d{line-height:1.3}
.day.sun .d{color:var(--sun)}.day.sat .d{color:var(--sat)}
.day.is-today{border-color:var(--ink)}
.day.has{background:var(--bg)}
.day:disabled{cursor:default}
.tag{font-size:10px;font-weight:700;line-height:1.25;border-radius:5px;padding:2px 2px;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap;display:block;width:100%;text-align:center}
.tag.work{background:var(--work);color:var(--work-ink)}
.tag.past{background:var(--work-soft);color:var(--work)}
.tag.want{box-shadow:inset 0 0 0 1.5px var(--work);color:var(--work)}
.tag.open{background:var(--open-soft);color:var(--open)}
.tag.filled{background:var(--filled);color:var(--muted)}
.tag.cancel{background:var(--open);color:var(--surface)}

.list .row,.rows .row,.kv .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.list .row:first-of-type,.rows .row:first-child,.kv .row:first-child{border-top:none}
.row .when{font-weight:700}
.row .where{color:var(--muted);font-size:14px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.work{background:var(--work);color:var(--work-ink)}
.pill.want{box-shadow:inset 0 0 0 1.5px var(--work);color:var(--work)}
.pill.cancel{background:var(--open);color:var(--surface)}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.quiet{background:var(--filled);color:var(--muted)}

/* cleaning */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.chead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.chead .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chead .place{font-size:20px;font-weight:700}
.chead .since{font-size:14px;color:var(--muted)}
.chead .left{font-size:14px;font-weight:700;color:var(--work);white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--work);transition:width .25s}
.sec h3{font-size:17px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:14px 0;font-size:16px}
.sec h3+.check{border-top:none}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--work-ink)}
.box svg{width:18px;height:18px;opacity:0}
.check.on .box{background:var(--work);border-color:var(--work)}
.check.on .box svg{opacity:1}
.check.on .txt{color:var(--muted);text-decoration:line-through}
.check.alert .txt{font-weight:700}
.note{display:block;font-size:13px;color:var(--open);font-weight:700}
.q{display:flex;flex-direction:column;gap:12px;padding-block:16px;border-top:1px solid var(--line)}
.q:first-child{border-top:none;padding-top:4px}
.q .ask{font-size:17px;font-weight:700}
.req{font-size:12px;font-weight:700;color:var(--danger);margin-left:6px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;font-size:16px;font-weight:500}
.yn button.sel{background:var(--work);border-color:var(--work);color:var(--work-ink);font-weight:700}
.yn button.sel.bad{background:var(--open);border-color:var(--open);color:var(--surface)}
.follow{display:flex;flex-direction:column;gap:10px;background:var(--open-soft);border-radius:12px;padding:14px}
.fl{font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:6px}
.txtin{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font-weight:400}
textarea.txtin{resize:vertical;line-height:1.5}
.photo{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--muted);border-radius:12px;padding:10px 14px;min-height:56px;cursor:pointer;background:var(--surface);font-weight:500}
.photo.has{border-style:solid;border-color:var(--work)}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sendbar{position:sticky;bottom:0;background:var(--bg);padding-top:12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center}
.sendbar .hint{font-size:13px;color:var(--muted)}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:28px}
.done .ok{width:72px;height:72px;border-radius:999px;background:var(--work);display:grid;place-items:center;color:var(--work-ink)}
.done .ok svg{width:40px;height:40px}
.done h1{font-size:24px}
.done .time{font-size:20px;font-weight:700}
.kv .row .k{color:var(--muted);font-size:14px;flex:none}
.kv .row .v{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}

/* time sheet */
.back{background:none;border:none;font-size:16px;padding:6px 0;color:var(--work);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:28px}
.trow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:none}
.trow .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px}

/* admin */
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--filled);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;border-radius:9px;min-height:40px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.todo{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:none;padding-top:4px}
.todo .kind{font-size:12px;font-weight:700;color:var(--open)}
.inl{display:flex;gap:8px}
.inl .txtin{flex:1;min-width:0}
.two{display:flex;gap:8px;flex-wrap:wrap}
.todo-row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:14px 0;text-align:left;gap:12px}
.todo .todo-row{border-top:none;padding:0}
.applicant{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.applicant:first-child{border-top:none}
select.txtin{appearance:auto}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .sd{color:var(--muted)}
.sheet h2{font-size:22px}
.sheet hr{border:none;border-top:1px solid var(--line);width:100%;margin:8px 0}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}

/* demo only */
.demo{max-width:440px;margin:0 auto 12px;background:var(--demo);color:var(--demo-ink);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.demo b{font-weight:700}
.demo select{flex:1;min-width:0;min-height:40px;border-radius:8px;border:none;padding:4px 8px;background:var(--surface);color:var(--ink)}
.memo{max-width:440px;margin:40px auto 0;border-top:2px dashed var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.memo h2{font-size:15px;color:var(--muted)}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.line .from{font-size:12px;color:var(--muted)}
.lk{color:var(--work);font-weight:700}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>
<!--wrap-->
</head>
<body>
<!--/wrap-->

<div class="demo" id="demo" hidden>
  <b>試作モード</b><span>見ている人</span>
  <select id="viewer" aria-label="見ている人">
    <option value="U_aoki">青木さん（ワーカー）</option>
    <option value="U_ishikawa">石川さん（ワーカー）</option>
    <option value="U_yamamoto">山本さん（管理）</option>
    <option value="U_newbie">はじめてログインした人</option>
  </select>
</div>

<main class="app" id="app" aria-live="polite"><p class="muted">読み込み中…</p></main>

<aside class="memo" id="memo" hidden aria-label="LINEに届くお知らせ（試作）">
  <h2>LINEに届くお知らせ（試作では、ここに表示）</h2>
  <div class="two">
    <button class="btn ghost sm" type="button" data-act="demoMorning">朝8時のお知らせを送る</button>
    <button class="btn ghost sm" type="button" data-act="demoEvening">夕方6時の確認を送る</button>
  </div>
  <div id="linelog" style="display:flex;flex-direction:column;gap:8px"></div>
  <button class="btn ghost" type="button" data-act="demoReset">試作を最初の状態に戻す</button>
</aside>

<script src="core.js"></script>
<script>
/* ===== 設定：本番ではここに LIFF ID と GAS の URL を入れる。空なら試作モードで動く ===== */
const CONFIG = { LIFF_ID: '', API_URL: 'https://script.google.com/macros/s/AKfycbyR2M1xUnRUG9oAj6642SY-WihvP9vaOrSSTHPlt82Mm6qs5HlZKQwPguDUym2JADM/exec' };
const DEMO = !CONFIG.LIFF_ID || !CONFIG.API_URL;

const U = Core.util;
const WD = '日月火水木金土';
const pad = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayStr = () => U.dateOf(Date.now());
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

const st = { data: null, view: 'home', month: null, time: null, timeMonth: null, busy: false, clean: null, lastReport: null };
const PH = {};          // 撮った写真（送信まで手元に置くだけ）
let idToken = null;

/* ---------- サーバーとのやりとり ---------- */
async function api(action, params) {
  if (DEMO) return Mock.call(action, params || {});
  let res;
  try {
    res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({}, params, { action, idToken })) });
  } catch (e) { throw new Error('通信できませんでした。電波のよい所で、もう一度押してください。'); }
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'AUTH') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('ログインし直します。'); }
    throw new Error(j.error);
  }
  return j.data;
}
async function run(fn, btn) {
  if (st.busy) return;
  st.busy = true;
  let label = null;
  if (btn) { label = btn.textContent; btn.disabled = true; btn.textContent = '送信中…'; }
  try { await fn(); }
  catch (e) { toast(e.userMessage || e.message || 'エラーが起きました。'); }
  finally {
    st.busy = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; if (st.view === 'clean') progress(); }
  }
}
async function load() { st.data = await api('bootstrap', { month: st.month }); render(); }
function loadScript(src) { return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error('LINEの部品を読み込めませんでした。')); document.head.appendChild(s); }); }

async function boot() {
  st.month = todayStr().slice(0, 7);
  try {
    if (DEMO) { Mock.init(); $('#demo').hidden = false; $('#memo').hidden = false; $('#viewer').value = Mock.viewer; renderLog(); }
    else {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken();
    }
    await load();
  } catch (e) {
    $('#app').innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:12px"><p><b>開けませんでした</b></p><p class="muted">${esc(e.userMessage || e.message || e)}</p><button class="btn primary" data-act="reload">もう一度開く</button></section>`;
  }
}

/* ---------- 画面の切り替え ---------- */
function render() {
  const d = st.data; if (!d) return;
  if (d.me.status !== 'active') return renderPending();
  if (d.me.role === 'admin') return st.view === 'time' ? renderTime() : st.view === 'pay' ? renderPay() : renderAdminHome();
  const t = d.todayJob;
  if (st.view === 'clean' && t && t.card && !t.card.end) return renderClean();
  if (st.view === 'done') return renderDone();
  if (st.view === 'time') return renderTime();
  st.view = 'home'; renderWorkerHome();
}

function renderPending() {
  $('#app').innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h1 style="font-size:22px">はじめまして、${esc(st.data.me.lineName)}さん</h1>
    <p>登録を受け付けました。オーナーが確認したら、LINEでお知らせします。</p></section>`;
}

/* ---------- カレンダー（ワーカーと管理者で中身が違う） ---------- */
function tagFor(j, admin, past) {
  if (admin) {
    if (j.assignee) return [past ? 'past' : 'work', j.assignee.name.slice(0, 3)];
    return past ? null : ['open', '募集中'];
  }
  switch (j.state) {
    case 'mine': return [past ? 'past' : 'work', 'お仕事'];
    case 'open': return past ? null : ['open', '募集中'];
    case 'filled': return past ? null : ['filled', '埋まり'];
  }
  return null;
}
function calendar(d) {
  const admin = d.me.role === 'admin';
  const [y, m] = st.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const by = {}; d.jobs.forEach(j => (by[j.date] = by[j.date] || []).push(j));
  let h = `<div class="calhead"><button data-act="prev" aria-label="前の月">‹</button><h2 class="num">${y}年${m}月</h2><button data-act="next" aria-label="次の月">›</button></div><div class="grid">`;
  [...WD].forEach((w, i) => h += `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`);
  for (let i = 0; i < first; i++) h += '<div class="day blank"></div>';
  for (let dd = 1; dd <= days; dd++) {
    const date = `${y}-${pad(m)}-${pad(dd)}`, wd = (first + dd - 1) % 7, past = date < d.today;
    const tags = (by[date] || []).map(j => tagFor(j, admin, past)).filter(Boolean).slice(0, 2);
    const cls = ['day', wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', date === d.today ? 'is-today' : '', tags.length ? 'has' : ''].join(' ');
    h += `<button class="${cls}" ${tags.length ? `data-day="${date}"` : 'disabled'} aria-label="${m}月${dd}日 ${tags.map(t => t[1]).join(' ')}">

function resize(file) {
  return new Promise((ok, ng) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.75)); };
    img.onerror = () => ng(new Error('写真を読み込めませんでした。'));
    img.src = url;
  });
}

/* ===== 試作モード：サーバーの代わりに、ブラウザの中で core.js を動かす ===== */
function seed() {
  const T = todayStr(), D = n => U.addDays(T, n), now = Date.now(), A = U.at;
  const user = (userId, name, lineName, role, status, wage, transport, taxType) => ({ userId, name, lineName, role, status, createdAt: now, wage: wage || '', transport: transport || 0, taxType: taxType || 'kou' });
  const users = [user('U_aoki', '青木', 'ゆい', 'worker', 'active', 1200, 0, 'kou'), user('U_ishikawa', '石川', 'いしかわ', 'worker', 'active', 1150, 300, 'kou'),
    user('U_morita', '森田', 'もりた', 'worker', 'active', 1200, 0, 'otsu'), user('U_yamamoto', '山本', '山本', 'admin', 'active'),
    user('U_sasaki', '佐々木', 'ささき', 'admin', 'active'), user('U_sato', '', 'さとう', 'worker', 'pending')];
  let n = 0;
  const job = (o, place, who, guestIn) => ({ id: 'J' + (n++), date: D(o), place, guestIn: guestIn || '', assignee: who || '' });
  const jobs = [job(-9, '押上の部屋', 'U_aoki'), job(-6, '浅草の家', 'U_ishikawa'), job(-4, '浅草の家', 'U_aoki'), job(-2, '押上の部屋', 'U_morita'),
    job(0, '浅草の家', 'U_aoki', '15:00'), job(0, '押上の部屋', 'U_ishikawa'),
    job(2, '押上の部屋'),
    job(3, '浅草の家', 'U_aoki'), job(5, '押上の部屋'), job(6, '浅草の家', 'U_ishikawa'), job(8, '押上の部屋'), job(10, '浅草の家'),
    job(13, '押上の部屋', 'U_aoki'), job(15, '浅草の家'), job(17, '押上の部屋', '', '16:00'), job(20, '浅草の家', 'U_morita')];
  const card = (jobId, userId, o, s, e, extra) => Object.assign({ jobId, userId, start: A(D(o), s), end: A(D(o), e), supplyOk: true, supplyNote: '',
    lost: false, lostPlace: '', lostPhoto: '', damage: false, damageNote: '', damagePhoto: '' }, extra || {});
  const cards = [card('J0', 'U_aoki', -9, '10:00', '11:45'), card('J1', 'U_ishikawa', -6, '10:30', '12:10'),
    card('J2', 'U_aoki', -4, '09:50', '11:20', { supplyOk: false, supplyNote: 'トイレットペーパー（残り1つ）' }),
    card('J3', 'U_morita', -2, '10:05', '11:55', { lost: true, lostPlace: 'キッチンの棚に置いた', lostPhoto: 'demo:none' }),
    Object.assign(card('J5', 'U_ishikawa', 0, '00:00', '00:00'), { start: now - 50 * 60000, end: null, supplyOk: '', lost: '', damage: '' })];
  const reqs = [{ id: 'R1', type: 'fix', jobId: 'J1', userId: 'U_ishikawa', start: '10:15', end: '12:10', at: now - 5e6, status: 'open' }];
  // 先月分の明細（送信済み）を 1 件だけ用意しておく
  const pm = U.prevMonth(T.slice(0, 7)), places = ['浅草の家', '押上の部屋'];
  const lines = [3, 8, 12, 17, 22, 27].map((dd, i) => { const date = `${pm}-${String(dd).padStart(2, '0')}`; return { date, place: places[i % 2], start: A(date, '10:00'), end: A(date, '11:40'), min: 100 }; });
  const stmts = [{ id: pm + '_U_aoki', month: pm, userId: 'U_aoki', name: '青木', days: 6, minutes: 600, wage: 1200, base: 12000, transport: 0, tax: 0, net: 12000,
    status: 'sent', hold: '', lines: JSON.stringify(lines), createdAt: now - 1e9, sentAt: now - 1e9 }];
  return { users, jobs, cards, reqs, stmts };
}
const Mock = {
  KEY: 'souji-liff-demo-v4', db: null, log: [], viewer: 'U_aoki', photos: {},
  PROFILES: { U_aoki: 'ゆい', U_ishikawa: 'いしかわ', U_yamamoto: '山本', U_newbie: 'はるか' },
  init() {
    let v = null; try { v = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) {}
    if (v && v.on === todayStr() && v.db) { this.db = v.db; this.log = v.log || []; this.viewer = v.viewer || 'U_aoki'; } else this.reset();
  },
  reset() { const keep = this.viewer; this.db = seed(); this.log = []; this.photos = {}; this.viewer = keep || 'U_aoki'; this.save(); },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify({ on: todayStr(), db: this.db, log: this.log, viewer: this.viewer })); } catch (e) {} },
  ctx() { return { now: Date.now(), today: todayStr(), liffUrl: 'https://liff.line.me/demo' }; },
  call(action, p) {
    return new Promise((ok, ng) => setTimeout(() => {
      try {
        const params = Object.assign({}, p);
        ['lost', 'damage'].forEach(k => { const key = k + 'PhotoData'; if (key in params) { if (params[key]) { const id = 'demo:' + Date.now() + k; this.photos[id] = params[key]; params[k + 'Photo'] = id; } delete params[key]; } });
        const r = Core.handle(this.db, { userId: this.viewer, name: this.PROFILES[this.viewer] }, action, JSON.parse(JSON.stringify(params)), this.ctx());
        this.db.dirty = {}; this.send(r.notify); this.save();
        ok(JSON.parse(JSON.stringify(r.data)));
      } catch (e) { ng(e); }
    }, 180));
  },
  send(list) {
    list.forEach(n => Core.recipients(this.db, n.to).forEach(id => {
      const u = this.db.users.find(x => x.userId === id);
      this.log.unshift({ to: u ? (u.name || u.lineName) : id, text: n.text, at: Date.now() });
    }));
    this.log = this.log.slice(0, 30); renderLog();
  }
};
function renderLog() {
  if (!DEMO) return;
  $('#linelog').innerHTML = Mock.log.length ? Mock.log.map(l => `<div class="line"><span class="from num">→ ${esc(l.to)}さん　${U.hm(l.at)}</span>
    <span>${esc(l.text).replace(/\n/g, '<br>').replace('https://liff.line.me/demo', '<span class="lk">▶ アプリを開く</span>')}</span></div>`).join('')
    : '<p class="muted" style="font-size:14px">まだありません。画面で操作すると、届くお知らせがここに出ます。</p>';
}

boot();
</script>
